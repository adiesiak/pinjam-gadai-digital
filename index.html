<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=pindai-2" />
  <link rel="apple-touch-icon" href="/logo.svg?v=pindai-2" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- `viewport-fit=cover` membuat `env(safe-area-inset-*)` benar-benar bernilai
       di perangkat bertakik (iOS/Android), sehingga bar bawah admin dan pil
       lokasi tidak tertutup indikator home. Chrome yang tidak mendukung
       mengabaikannya, dan inset tetap 0 sehingga hasilnya sama seperti semula. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d3a" />
  <meta
    name="description"
    content="PINDAI — pinjam & gadai digital. Ajukan pinjaman tanpa agunan atau gadaikan barang dari rumah, didanai Pendana terverifikasi."
  />
  <title>PINDAI — Pinjam & Gadai Digital</title>
  <style>
    /* Gaya layar pemuatan awal — SENGAJA mandiri (tanpa Tailwind/index.css).
       Alasannya: di server pengembangan, bundel CSS dikirim lewat JavaScript,
       sehingga HTML statis ini tampil lebih dulu tanpa gaya apa pun dan
       hasilnya terlihat rusak (teks menyatu, bilah proses menghilang).
       Menuliskan gayanya di sini membuat layar pemuatan selalu benar pada
       paint pertama, di dev maupun produksi. Nilai-nilainya disamakan dengan
       components/LoadingScreen.tsx agar tidak ada lompatan tampilan saat React
       mengambil alih. */
    html, body { margin: 0; background: #f8fafc; color: #0f172a; }
    #pindai-boot * { box-sizing: border-box; }
    #pindai-boot {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .pb__grup { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .pb__stage {
      position: relative;
      display: flex;
      width: 10rem;
      height: 10rem;
      align-items: center;
      justify-content: center;
      perspective: 900px;
    }
    .pb__vault { position: relative; z-index: 1; display: block; }
    .pb__halo {
      position: absolute;
      inset: 14%;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(15, 61, 58, 0.2), transparent 70%);
      animation: pb-halo 3s ease-in-out infinite;
    }
    .pb__scan {
      position: absolute;
      left: 14%;
      right: 14%;
      height: 2px;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, #b99b62, transparent);
      box-shadow: 0 0 12px 2px rgba(185, 155, 98, 0.55);
      animation: pb-scan 2.6s ease-in-out infinite;
    }
    .pb__dial {
      transform-box: fill-box;
      transform-origin: center;
      animation: pb-dial 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    /* Disamakan dengan src/index.css: tudung salju hanya tampil pada tema
       salju, jadi splash pun menyembunyikannya agar tidak muncul-hilang saat
       stylesheet utama mengambil alih. */
    .vault-snow { display: none; }
    .pb__brand { display: flex; flex-direction: column; align-items: center; gap: 0.375rem; }
    .pb__line { display: flex; align-items: baseline; gap: 0.375rem; }
    .pb__kata {
      font-size: 1.125rem;
      font-weight: 900;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #0f3d3a;
    }
    .pb__titik { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background: #b99b62; }
    .pb__sub {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .pb__sub i { display: block; width: 1rem; height: 1px; background: #b99b62; }
    .pb__progress { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 13rem; }
    .pb__track { width: 100%; height: 0.25rem; overflow: hidden; border-radius: 9999px; background: #e2e8f0; }
    .pb__bar {
      display: block;
      height: 100%;
      width: 33%;
      border-radius: 9999px;
      background: #0f3d3a;
      animation: pb-bar 1.5s ease-in-out infinite;
    }
    .pb__label { margin: 0; font-size: 0.75rem; font-weight: 500; color: #64748b; }
    @keyframes pb-dial { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(66deg); } }
    @keyframes pb-halo {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes pb-scan {
      0% { top: 16%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 84%; opacity: 0; }
    }
    @keyframes pb-bar { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
    @media (prefers-reduced-motion: reduce) {
      .pb__dial, .pb__halo, .pb__scan, .pb__bar { animation: none; }
    }
  </style>
</head>


<body>
  <!-- Layar pemuatan awal. HTML statis supaya animasi tampil pada paint pertama,
       tanpa menunggu bundel JavaScript. createRoot() menghapus isi #root saat
       aplikasi menyala, jadi elemen ini otomatis hilang. Semua gayanya ada di
       blok <style> di atas (lihat catatan kenapa tidak memakai Tailwind).
       Isinya disamakan dengan components/LoadingScreen.tsx: brankas TERTUTUP,
       jarum dial berputar, garis pindai, tanpa uang. -->
  <div id="root">
    <div id="pindai-boot">
      <div class="pb__grup">
        <div class="pb__stage">
          <span class="pb__halo" aria-hidden="true"></span>
          <svg class="pb__vault" width="96" height="96" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="5" y="6" width="54" height="50" rx="12" fill="#0f3d3a" stroke="#b99b62" stroke-width="2" />
            <path d="M15 10h34" stroke="#ffffff" stroke-opacity=".18" stroke-width="2" stroke-linecap="round" />
            <rect x="11" y="12" width="42" height="38" rx="7" fill="#f5f2e9" />
            <rect x="14" y="15" width="36" height="32" rx="5" stroke="#d9d2c1" stroke-width="1.5" />
            <rect x="7" y="19" width="5" height="7" rx="2.5" fill="#cbb47e" />
            <rect x="7" y="36" width="5" height="7" rx="2.5" fill="#cbb47e" />
            <g class="pb__dial">
              <circle cx="31" cy="31" r="10" fill="#0f3d3a" />
              <circle cx="31" cy="31" r="7.2" stroke="#cbb47e" stroke-width="1.5" />
              <path d="M31 31l7-5M31 24v2M38 31h-2M31 38v-2M24 31h2" stroke="#f5f2e9" stroke-width="1.7" stroke-linecap="round" />
              <circle cx="31" cy="31" r="2.2" fill="#cbb47e" />
            </g>
            <path d="M20 57h8M36 57h8" stroke="#0b2d2a" stroke-width="3" stroke-linecap="round" />
            <!-- Tutup salju di atas brankas — bentuknya disamakan dengan
                 components/LoadingScreen.tsx supaya tidak ada lompatan tampilan
                 saat React mengambil alih splash ini. -->
            <g class="vault-snow" aria-hidden="true">
              <path d="M6 16 C 13 9, 21 17, 31 12 C 41 7, 49 16, 58 10 L58 9 C58 7 56 6 54 6 L10 6 C8 6 6 7 6 9 Z" fill="#ffffff" opacity="0.96" />
              <circle cx="17" cy="13" r="2.6" fill="#ffffff" opacity="0.9" />
              <circle cx="45" cy="12" r="3" fill="#ffffff" opacity="0.92" />
            </g>
          </svg>
          <span class="pb__scan" aria-hidden="true"></span>
        </div>

        <div class="pb__brand">
          <span class="pb__line">
            <span class="pb__kata">PINDAI</span>
            <span class="pb__titik" aria-hidden="true"></span>
          </span>
          <span class="pb__sub">
            <i aria-hidden="true"></i>
            Pinjam · Gadai Digital
            <i aria-hidden="true"></i>
          </span>
        </div>
      </div>

      <div class="pb__progress">
        <div class="pb__track">
          <span class="pb__bar"></span>
        </div>
        <p class="pb__label" role="status" aria-live="polite">Memuat…</p>
      </div>
    </div>
  </div>
  <noscript>
    <p style="font: 500 14px/1.6 system-ui, sans-serif; color: #334155; text-align: center; padding: 2rem 1.5rem">
      PINDAI memerlukan JavaScript untuk berjalan. Aktifkan JavaScript lalu muat ulang halaman ini.
    </p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
