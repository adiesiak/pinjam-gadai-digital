<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- `?v=` adalah penghancur cache ikon. Nilainya dinaikkan setiap kali HTML
       ini perlu dibaca ulang oleh server pengembangan: halaman pratinjau yang
       menyimpan HTML lama masih meminta id modul inline (`?html-proxy&index=…`)
       dari proses server sebelumnya, dan Vite menolaknya dengan "No matching
       HTML proxy module found". Mengubah berkas HTML membuat server menggambar
       ulang HTML ini dan memuat ulang halaman, jadi id proxy yang diminta
       selalu ada di proses yang sedang berjalan. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=pindai-3" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=1.3.1"
    />
    <link rel="manifest" href="/manifest.webmanifest?v=1.3.1" />
    <!-- `viewport-fit=cover` membuat `env(safe-area-inset-*)` benar-benar bernilai
       di perangkat bertakik (iOS/Android), sehingga bar bawah admin dan pil
       lokasi tidak tertutup indikator home. Chrome yang tidak mendukung
       mengabaikannya, dan inset tetap 0 sehingga hasilnya sama seperti semula. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3d3a" />
    <meta
      name="description"
      content="Kelola pilihan pinjaman dan gadai secara digital dengan informasi biaya dan ketentuan yang jelas."
    />
    <title>PINDAI — Pinjaman dan Gadai Digital</title>

    <!-- Tema & gaya dipasang SEBELUM paint pertama, dari nilai terakhir yang
       dilihat peramban ini. Tanpa ini, pengunjung melihat palet bawaan sekilas
       lalu warna berganti setelah query Convex selesai (kilat warna). React
       memperbaruinya bila admin mengganti template. Skrip ini tidak boleh
       menunggu bundel: ia satu-satunya alasan `data-theme` sudah benar di paint
       pertama.

       Berkasnya terpisah (`public/tema-awal.js`), bukan blok sebaris, supaya
       Content-Security-Policy di `main.ts` dapat memakai `script-src 'self'`
       tanpa pengecualian `'unsafe-inline'` yang juga berlaku untuk skrip
       suntikan. -->
    <script src="/tema-awal.js"></script>

    <!-- Open Graph / Twitter. Deskripsi sengaja sama dengan meta description di
       atas agar tidak ada dua janji berbeda soal produk. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PINDAI" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="PINDAI — Pinjaman dan Gadai Digital" />
    <meta
      property="og:description"
      content="Kelola pilihan pinjaman dan gadai secara digital dengan informasi biaya dan ketentuan yang jelas."
    />
    <!-- Pratinjau tautan WhatsApp/Facebook memakai PNG: banyak crawler tidak
       merender SVG, sehingga gambar pratinjau sebelumnya kosong. -->
    <meta property="og:image" content="https://pindai.biz.id/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo PINDAI" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PINDAI — Pinjaman dan Gadai Digital" />
    <meta
      name="twitter:description"
      content="Kelola pilihan pinjaman dan gadai secara digital dengan informasi biaya dan ketentuan yang jelas."
    />
    <meta name="twitter:image" content="https://pindai.biz.id/icon-512.png" />
    <style>
      /* Gaya layar pemuatan awal — SENGAJA mandiri (tanpa Tailwind/index.css).
       Alasannya: di server pengembangan, bundel CSS dikirim lewat JavaScript,
       sehingga HTML statis ini tampil lebih dulu tanpa gaya apa pun dan
       hasilnya terlihat rusak (teks menyatu, bilah proses menghilang).
       Menuliskan gayanya di sini membuat layar pemuatan selalu benar pada
       paint pertama, di dev maupun produksi. Nilai-nilainya disamakan dengan
       components/LoadingScreen.tsx agar tidak ada lompatan tampilan saat React
       mengambil alih. */
      html,
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      #pindai-boot * {
        box-sizing: border-box;
      }
      #pindai-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 0 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .pb__grup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .pb__stage {
        position: relative;
        display: flex;
        width: 10rem;
        height: 10rem;
        align-items: center;
        justify-content: center;
        perspective: 900px;
      }
      .pb__vault {
        position: relative;
        z-index: 1;
        display: block;
      }
      .pb__halo {
        position: absolute;
        inset: 14%;
        border-radius: 9999px;
        background: radial-gradient(
          circle,
          rgba(15, 61, 58, 0.2),
          transparent 70%
        );
        animation: pb-halo 3s ease-in-out infinite;
      }
      .pb__scan {
        position: absolute;
        left: 14%;
        right: 14%;
        height: 2px;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, #b99b62, transparent);
        box-shadow: 0 0 12px 2px rgba(185, 155, 98, 0.55);
        animation: pb-scan 2.6s ease-in-out infinite;
      }
      .pb__dial {
        transform-box: fill-box;
        transform-origin: center;
        animation: pb-dial 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      /* Disamakan dengan src/index.css: tudung salju hanya tampil pada tema
       salju, jadi splash pun menyembunyikannya agar tidak muncul-hilang saat
       stylesheet utama mengambil alih. */
      .vault-snow {
        display: none;
      }
      .pb__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.375rem;
      }
      .pb__line {
        display: flex;
        align-items: baseline;
        gap: 0.375rem;
      }
      .pb__kata {
        font-size: 1.125rem;
        font-weight: 900;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #0f3d3a;
      }
      .pb__titik {
        width: 0.375rem;
        height: 0.375rem;
        border-radius: 9999px;
        background: #b99b62;
      }
      .pb__sub {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .pb__sub i {
        display: block;
        width: 1rem;
        height: 1px;
        background: #b99b62;
      }
      .pb__progress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 13rem;
      }
      .pb__track {
        width: 100%;
        height: 0.25rem;
        overflow: hidden;
        border-radius: 9999px;
        background: #e2e8f0;
      }
      .pb__bar {
        display: block;
        height: 100%;
        width: 33%;
        border-radius: 9999px;
        background: #0f3d3a;
        animation: pb-bar 1.5s ease-in-out infinite;
      }
      .pb__label {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 500;
        color: #64748b;
      }
      @keyframes pb-dial {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(66deg);
        }
      }
      @keyframes pb-halo {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }
      @keyframes pb-scan {
        0% {
          top: 16%;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          top: 84%;
          opacity: 0;
        }
      }
      /* Bilah berayun di dalam jalurnya (selalu terlihat). Saat gerak dikurangi,
       ia berdenyut opasitas, bukan dibekukan. Nilainya sama dengan index.css. */
      @keyframes pb-bar {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(200%);
        }
      }
      @keyframes pb-bar-fade {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pb__dial,
        .pb__halo,
        .pb__scan {
          animation: none;
        }
        .pb__bar {
          animation: pb-bar-fade 1.8s ease-in-out infinite;
        }
      }
    </style>

  <body>

    <div id="root">

          <div class="pb__brand">
