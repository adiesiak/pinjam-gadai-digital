# =============================================================================
# TAHAP 1 — Nginx HTTP saja, dipakai SEBELUM sertifikat SSL terbit.
#
# Pasang ke /etc/nginx/sites-available/pindai.biz.id, aktifkan symlink, lalu:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pindai.biz.id -d www.pindai.biz.id
#
# Setelah Certbot selesai, GANTI berkas ini dengan `pindai.biz.id.conf`
# (versi HTTPS + pengalihan www). Berkas ini sengaja tidak memaksa HTTPS:
# sebelum sertifikat ada, pengalihan ke https hanya menghasilkan galat.
#
# Aplikasi diasumsikan berjalan di 127.0.0.1:8000 (Deno/Hono `main.ts`).
# Ubah `pindai_app` bila proses dilayani port lain.
# =============================================================================

upstream pindai_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pindai.biz.id www.pindai.biz.id;

    # Tantangan HTTP-01 Let's Encrypt. Certbot menulis berkas di sini.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://pindai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
