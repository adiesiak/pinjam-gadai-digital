# =============================================================================
# TAHAP 2 — Nginx HTTPS untuk pindai.biz.id dan www.pindai.biz.id.
#
# Pasang SETELAH `certbot --nginx` berhasil (sertifikat harus mencakup kedua
# nama). Berkas ini menggantikan `pindai.biz.id.http.conf`.
#
#   sudo cp deploy/nginx/pindai.biz.id.conf /etc/nginx/sites-available/pindai.biz.id
#   sudo nginx -t && sudo systemctl reload nginx
#
# Aplikasi diasumsikan berjalan di 127.0.0.1:8000 (Deno/Hono `main.ts`).
# =============================================================================

upstream pindai_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP: hanya untuk tantangan ACME dan pengalihan permanen ke HTTPS.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pindai.biz.id www.pindai.biz.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://pindai.biz.id$request_uri;
    }
}

# -----------------------------------------------------------------------------
# WWW: dialihkan permanen ke apex. Satu alamat kanonik mencegah sesi, tautan
# verifikasi, dan metadata berbagi terbelah menjadi dua origin.
#
# Blok ini tetap memegang sertifikat www supaya permintaan pertama tidak gagal
# TLS sebelum pengalihan sempat dikirim.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pindai.biz.id;

    ssl_certificate     /etc/letsencrypt/live/pindai.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pindai.biz.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pindai.biz.id$request_uri;
}

# -----------------------------------------------------------------------------
# APEX: aplikasi sebenarnya.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pindai.biz.id;

    ssl_certificate     /etc/letsencrypt/live/pindai.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pindai.biz.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Penyamaran versi Nginx: tidak ada manfaat memberi tahu versi server.
    server_tokens off;

    # Unggahan KTP/selfie dan bukti pembayaran. Server aplikasi tetap memeriksa
    # ukuran dan tipe berkas; angka ini hanya pagar transport.
    client_max_body_size 12m;

    # Header keamanan (HSTS, CSP, X-Frame-Options, Permissions-Policy) sudah
    # dipasang `main.ts`. Jangan menambahkannya lagi di sini: dua nilai CSP akan
    # dibaca peramban sebagai irisan yang lebih ketat dan bisa memutus fitur.

    location /assets/ {
        proxy_pass http://pindai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Nama berkas ber-hash: aman di-cache lama.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://pindai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
